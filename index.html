<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="2026-11-14b">
<title>MTG Studio — Collection & Decks 2026</title>
<style>
:root{
  --bg:#12141c; --panel:#1b1f2b; --panel2:#232838; --text:#e8eaf0; --muted:#9aa1b5;
  --accent:#5b8cff; --ok:#3ecf6f; --warn:#ffb74d; --bad:#ff5b6a;
  --border:#2e3547; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:none}
#topbar{padding:12px 18px;background:linear-gradient(135deg,#1a2540,#251b40);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:90}
#burger{font-size:20px;background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;width:40px;height:36px;cursor:pointer}
#topbar h1{font-size:19px}
#topbar h1 span{color:var(--accent)}
.syncdot{margin-left:auto;font-size:12px;align-self:center;white-space:nowrap}
.syncdot.ok{color:#7ec97e}
.syncdot.off{color:#d8a441}
.tagline{color:var(--muted);font-size:12px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:94}
#sidebar{position:fixed;top:57px;left:0;bottom:0;width:250px;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding:10px 8px 30px;z-index:95;transition:transform .2s;display:flex;flex-direction:column;gap:3px}
#sidebar.hidden{transform:translateX(-100%)}
.side-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;
  color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.side-link:hover{background:var(--panel2)}
.side-link.active{background:rgba(91,140,255,.18);color:var(--accent);font-weight:600}
.side-link .arr{margin-left:auto;font-size:11px;transition:transform .15s}
.side-group.open .arr{transform:rotate(180deg)}
.side-sub{display:none;flex-direction:column;gap:2px;padding-left:20px}
.side-group.open .side-sub{display:flex}
.side-search{padding:6px;margin-bottom:6px;position:relative}
.side-search input{width:100%;min-width:0}
nav{display:none}
main{padding:18px 24px 18px calc(250px + 24px);max-width:1400px;margin:0 auto}
body.sideoff main{padding-left:24px}
body.sideoff #sidebar{transform:translateX(-100%)}
.rl-badge{color:#f26a6a;font-weight:700;font-size:10.5px;background:rgba(242,106,106,.12);
  border:1px solid rgba(242,106,106,.45);border-radius:4px;padding:0 4px;cursor:help}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);box-shadow:8px 0 30px rgba(0,0,0,.4)}
  body.sideopen #sidebar{transform:translateX(0)}
  body.sideopen #scrim{display:block}
  main{padding-left:24px}
}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h3.sub{margin:14px 0 8px;font-size:15px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:8px;font-size:14px}
input[type=text]{min-width:200px}
button.btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
button.btn:hover{filter:brightness(1.12)}
button.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
button.btn.danger{background:rgba(255,91,106,.15);color:var(--bad);border:1px solid var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
td{padding:8px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--panel2)}
.hint{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:rgba(91,140,255,.14);color:var(--accent);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px}
.tag.auto{background:rgba(124,91,255,.15);color:#a88bff}
.tag.custom{background:rgba(62,207,111,.14);color:var(--ok)}
.fmt{background:rgba(91,140,255,.15);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.deck-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.deck{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s}
.deck:hover{border-color:var(--accent)}
.deck h3{font-size:15px;margin-bottom:2px}
.deck .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;border-radius:6px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.cardtile{background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cardtile img{width:100%;aspect-ratio:488/680;object-fit:cover;background:#000;cursor:pointer}
.cardtile .info{padding:8px 10px;font-size:12px;flex:1}
.cardtile .name{font-weight:600;font-size:13px;line-height:1.25;height:2.5em;overflow:hidden}
.cardtile .price{color:var(--warn);font-weight:600}
.qty-ctl{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:6px 0}
.qty-ctl button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:16px}
.qty-ctl button:hover{border-color:var(--accent)}
.qty-ctl b{min-width:26px;text-align:center}
.suggbox{position:relative;flex:1;min-width:240px}
.suggestions{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--border);
  border-radius:0 0 8px 8px;z-index:60;max-height:260px;overflow:auto}
.suggestions div{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.suggestions div:hover{background:var(--accent);color:#fff}
.suggestions img{height:24px;border-radius:3px}
.sughead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:default;padding:4px 12px!important}
.sughead:hover{background:transparent;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;overflow:auto;padding:40px 16px}
.modal-bg.open{display:block}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:700px;margin:0 auto;padding:20px;position:relative}
.modal .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.cardline{display:flex;justify-content:space-between;padding:3px 8px;border-radius:6px;align-items:center}
.cardline:nth-child(odd){background:var(--panel2)}
.cardline img{height:20px;border-radius:2px;vertical-align:-3px;margin-right:8px}
.cardline .n{color:var(--ok)}
.cardline .m{color:var(--bad)}
.deckimg{width:16px;height:16px;border-radius:2px;vertical-align:-2px;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel2);border-radius:var(--radius);padding:14px;text-align:center}
.kpi .v{font-size:26px;font-weight:700;color:var(--accent)}
.kpi .l{color:var(--muted);font-size:12px}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:14px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.matrix td.heat{background:rgba(91,140,255,.12);text-align:center}
.matrix td.heat b{font-size:13px}
canvas.chart{max-width:100%;background:var(--panel2);border-radius:10px;margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--panel2);color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.tabs button.active{color:#fff;border-color:var(--accent);background:rgba(91,140,255,.2)}
.binderchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px}
.binderchip.active{border-color:var(--accent);color:var(--accent)}
.matchline{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.matchline .w{color:var(--ok);font-weight:700}
.matchline .l{color:var(--bad);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.pill{font-size:12px;color:var(--muted)}
.link{color:var(--accent);cursor:pointer;text-decoration:underline}
input[type=range]{accent-color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.b-ok{background:rgba(62,207,111,.15);color:var(--ok)}
.b-warn{background:rgba(255,183,77,.15);color:var(--warn)}
.b-null{background:rgba(154,161,181,.18);color:var(--muted)}
@media(max-width:720px){nav{position:static}header{position:static}}
/* ---- collection v2 ---- */
#zoomer{position:fixed;z-index:150;pointer-events:none;display:none;border-radius:12px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.6);border:1px solid var(--border)}
#zoomer img{display:block;width:300px}
.collthumb{width:44px;height:61px;object-fit:cover;border-radius:4px;background:#000;cursor:zoom-in;display:block}
.gridthumb{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:8px 8px 0 0;background:#000;cursor:zoom-in}
.tagchip{display:inline-flex;align-items:center;gap:5px;background:rgba(91,140,255,.14);color:var(--accent);
  border-radius:12px;padding:1px 8px;font-size:11.5px;margin:1px;white-space:nowrap}
.tagchip.filled{background:rgba(62,207,111,.15);color:var(--ok);cursor:pointer}
.tagchip .x{cursor:pointer;font-weight:700;opacity:.7}
.tagchip .x:hover{opacity:1;color:var(--bad)}
.foil-badge{color:#f5c97b;font-weight:700;font-size:11px;background:rgba(245,201,123,.12);
  border:1px solid rgba(245,201,123,.4);border-radius:4px;padding:0 4px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:10px;
  background:var(--panel2);border-radius:10px}
.filterbar select,.filterbar input{padding:6px 9px;font-size:13px}
.filterbar input[type=number]{width:90px}
.filterbar input[type=text]{min-width:160px}
.colorpick{display:inline-flex;gap:2px}
.colorpick span{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--panel)}
.colorpick span.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bulkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:rgba(91,140,255,.1);
  border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin:10px 0}
.bulkbar select{padding:5px 8px}
.trash{cursor:pointer;color:var(--muted);font-size:15px}
.trash:hover{color:var(--bad)}
.seticon{height:16px;width:16px;vertical-align:-3px;margin-right:4px;opacity:.85}
.pbar{height:7px;background:var(--panel);border-radius:5px;overflow:hidden;min-width:90px}
.pbar div{height:100%;background:linear-gradient(90deg,#5b8cff,#3ecf6f)}
.pct{font-size:11.5px;color:var(--muted);white-space:nowrap}
.entryrow img.collthumb:hover{outline:2px solid var(--accent)}
/* grille vignettes collection */
.collgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.colltile{background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;position:relative}
.colltile .info{padding:6px 8px;font-size:11.5px;flex:1}
.colltile .name{font-weight:600;font-size:12.5px;line-height:1.25;height:2.5em;overflow:hidden;cursor:pointer}
.colltile .qtyb{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);color:#fff;border-radius:6px;
  padding:1px 7px;font-size:12px;font-weight:700}
.colltile .chkb{position:absolute;top:6px;right:6px}
.multisel{position:relative}
.multisel .opts{display:none;position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:6px;z-index:70;max-height:240px;overflow:auto;min-width:160px}
.multisel.open .opts{display:block}
.multisel .opts label{display:flex;gap:8px;padding:3px 4px;font-size:13px;cursor:pointer}
.multisel .opts label:hover{background:var(--panel2)}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div><div id="loadmsg">Chargement des 41 366 decks 2026…</div>
<div id="zoomer"><img alt=""></div>
  <input type="file" id="filepick" accept=".json" style="display:none">
  <button class="btn" id="pickbtn" style="display:none">Choisir decks.json manuellement</button>
</div>
<div id="topbar">
  <button id="burger" title="Menu">☰</button>
  <h1>MTG <span>Studio</span></h1>
  <span class="tagline">Collection · Decks MTGTop8 2026 · Matchs &amp; Stats · Données en BDD SQLite</span>
  <span id="syncdot" class="syncdot off">…</span>
</div>
<div id="scrim"></div>
<aside id="sidebar">
  <div class="side-search">
    <input type="text" id="globsearch" placeholder="🔍 Carte, deck MTGTop8, archétype, deck perso…" autocomplete="off">
    <div class="suggestions" id="gsugg" style="display:none"></div>
  </div>
  <button class="side-link" data-view="collection" data-icn="🃏">Collection</button>
  <button class="side-link" data-view="advsearch" data-icn="🔎">Recherche avancée</button>
  <button class="side-link" data-view="browse-sets" data-icn="📦">Extensions</button>
  <div class="side-group">
    <button class="side-link grp" data-grp="decks" data-icn="🏆">Decks <span class="arr">▾</span></button>
    <div class="side-sub">
      <button class="side-link" data-view="decks" data-icn="🏆">Deck MTG Top 8</button>
      <button class="side-link" data-view="archetypes" data-icn="📊">Archétypes</button>
      <button class="side-link" data-view="playable" data-icn="✅">Decks jouables</button>
      <button class="side-link" data-view="mydecks" data-icn="📝">Deck perso</button>
    </div>
  </div>
  <button class="side-link" data-view="market" data-icn="💶">Marché</button>
  <button class="side-link" data-view="statscoll" data-icn="📊">Statistiques collection</button>
  <div class="side-group">
    <button class="side-link grp" data-grp="matches" data-icn="⚔️">Matchs <span class="arr">▾</span></button>
    <div class="side-sub">
      <button class="side-link" data-view="matches" data-icn="⚔️">Saisir un match</button>
      <button class="side-link" data-view="stats" data-icn="📈">Statistiques du joueur</button>
      <button class="side-link" data-view="matchups" data-icn="🧩">Matrice des matchups</button>
    </div>
  </div>
  <button class="side-link" data-view="cardinfo" data-icn="🧠">Cartes &amp; tags</button>
  <button class="side-link" data-view="settings" data-icn="⚙️">Paramètres</button>
</aside>
<main id="app"><p class="hint">Chargement…</p></main>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>

<script src="app.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" nonce="tULu/vPRtYkcwxzGynW8Og==" data-cf-beacon='{"version":"2024.11.0","token":"36b4216ae2dc4d5488c249161e71fe1e","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
