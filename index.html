<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="2026-11-16m">
<title>MTG Studio — Collection & Decks 2026</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("mtg_theme")||'"darkmode"')}catch(e){document.documentElement.dataset.theme="darkmode"}</script>
</head>
<body>
<div id="loader"><div class="spin"></div><div id="loadmsg">Chargement des decks 2026 depuis la base SQLite…</div>
  <input type="file" id="filepick" accept=".json" style="display:none">
  <button class="btn" id="pickbtn" style="display:none">Choisir decks.json manuellement</button>
</div>
<div id="zoomer"><img alt=""></div>
<div id="topbar">
  <button id="burger" title="Menu">☰</button>
  <h1><img class="logo" src="assets/logo.svg" alt="">MTG <span>Studio</span></h1>
  <span class="tagline">Collection · Decks MTGTop8 2026 · Matchs &amp; Stats · Données en BDD SQLite</span>
  <span id="syncdot" class="syncdot off">…</span>
</div>
<div id="scrim"></div>
<aside id="sidebar">
  <div class="side-search">
    <input type="text" id="globsearch" placeholder="🔍 Carte, deck MTGTop8, archétype, deck perso…" autocomplete="off">
    <div class="suggestions" id="gsugg" style="display:none"></div>
  </div>
  <button class="side-link" data-view="collection" data-icn="🃏">Collection</button>
  <button class="side-link" data-view="advsearch" data-icn="🔎">Recherche avancée</button>
  <button class="side-link" data-view="browse-sets" data-icn="📦">Extensions</button>
  <div class="side-group">
    <button class="side-link grp" data-grp="decks" data-icn="🏆">Decks <span class="arr">▾</span></button>
    <div class="side-sub">
      <button class="side-link" data-view="decks" data-icn="🏆">Deck MTG Top 8</button>
      <button class="side-link" data-view="archetypes" data-icn="📊">Archétypes</button>
      <button class="side-link" data-view="playable" data-icn="✅">Decks jouables</button>
      <button class="side-link" data-view="mydecks" data-icn="📝">Deck perso</button>
    </div>
  </div>
  <button class="side-link" data-view="market" data-icn="💶">Marché</button>
  <button class="side-link" data-view="statscoll" data-icn="📊">Statistiques collection</button>
  <div class="side-group">
    <button class="side-link grp" data-grp="matches" data-icn="⚔️">Matchs <span class="arr">▾</span></button>
    <div class="side-sub">
      <button class="side-link" data-view="matches" data-icn="⚔️">Saisir un match</button>
      <button class="side-link" data-view="stats" data-icn="📈">Statistiques du joueur</button>
      <button class="side-link" data-view="matchups" data-icn="🧩">Matrice des matchups</button>
    </div>
  </div>
  <button class="side-link" data-view="cardinfo" data-icn="🧠">Cartes &amp; tags</button>
  <button class="side-link" data-view="settings" data-icn="⚙️">Paramètres</button>
</aside>
<main id="app"><p class="hint">Chargement…</p></main>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" nonce="tULu/vPRtYkcwxzGynW8Og==" data-cf-beacon='{"version":"2024.11.0","token":"36b4216ae2dc4d5488c249161e71fe1e","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
